name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: learnforge
          POSTGRES_PASSWORD: learnforge
          POSTGRES_DB: learnforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U learnforge" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://learnforge:learnforge@localhost:5432/learnforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema backend/prisma/schema.prisma
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Backend tests (unit + integration, coverage gate 70%)
        run: npm run test:coverage -w backend
      - name: Frontend component tests
        run: npm run test:coverage -w frontend
      - name: Production build
        run: npm run build

  docker:
    name: Docker images, smoke test, Playwright e2e
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: docker compose build
      - name: Start stack (waits for health checks)
        run: docker compose up -d --wait --wait-timeout 300
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Smoke test
        run: ./scripts/smoke.sh
      - name: Playwright e2e
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
      - name: Stop stack
        if: always()
        run: docker compose down -v
