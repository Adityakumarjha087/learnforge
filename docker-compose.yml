name: learnforge

x-api-env: &api-env
  NODE_ENV: production
  PORT: "4000"
  DATABASE_URL: postgresql://learnforge:learnforge@postgres:5432/learnforge?connect_timeout=30
  REDIS_URL: redis://redis:6379
  APP_URL: ${APP_URL:-http://localhost:21000}
  JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret-change-me}
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  LLM_MODEL: ${LLM_MODEL:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
  BILLING_MODE: ${BILLING_MODE:-mock}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
  SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-quickjs}
  PISTON_URL: ${PISTON_URL:-http://piston:2000}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:21001}
  DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-true}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: learnforge-postgres
    environment:
      POSTGRES_USER: learnforge
      POSTGRES_PASSWORD: learnforge
      POSTGRES_DB: learnforge
    ports:
      - "21010:5432"
    volumes:
      - learnforge-pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnforge -d learnforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: learnforge-redis
    ports:
      - "21011:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: learnforge-api
    environment:
      <<: *api-env
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - "21001:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:21001}
    container_name: learnforge-web
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "21000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Optional real multi-language code sandbox. Enable with:
  #   docker compose --profile sandbox up -d && SANDBOX_PROVIDER=piston
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: learnforge-piston
    profiles: ["sandbox"]
    privileged: true
    ports:
      - "21020:2000"
    tmpfs:
      - /piston/jobs:exec,uid=1000,gid=1000,mode=711

volumes:
  learnforge-pgdata:
    name: learnforge-pgdata
